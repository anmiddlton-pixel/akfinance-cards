document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 && d.fill) ? d.fill : (flat ? GR1 : `url(#g${k})`) }))\n        )\n      );\n    };\n\n    // rounded outer ends, points meeting at the centre\n    const bothEnds = (arr, cx, y, hw, th) => { arr.push(sliver(cx + hw, y, cx, y, th, 0.4)); arr.push(sliver(cx - hw, y, cx, y, th, 0.4)); };\n\n    // 01 — Поток (ragged-left block of horizontals)\n    const m1 = []; const lf = [62, 40, 54, 44, 66, 46, 58, 42, 60, 48, 56, 50];\n    for (let i = 0; i < 12; i++) { const y = 50 + i * (100 / 11); m1.push(sliver(160, y, lf[i], y, 4.0, 0.4)); }\n\n    // 02 — Лесенка (ascending shifted)\n    const m2 = [];\n    for (let i = 0; i < 12; i++) { const t = i / 11; const y = 160 - t * 116; const xL = 38 + t * 64; m2.push(sliver(xL + 78, y, xL, y, 4.0, 0.4)); }\n\n    // 03 — Пирамида\n    const m3 = [];\n    for (let i = 0; i < 12; i++) { const t = i / 11; const y = 158 - t * 110; bothEnds(m3, 100, y, (1 - t) * 60 + 5, 4.0); }\n\n    // 04 — Ромб\n    const m4 = [];\n    for (let i = 0; i < 13; i++) { const t = i / 12; const y = 44 + t * 112; bothEnds(m4, 100, y, Math.sin(Math.PI * t) * 62 + 3, 3.8); }\n\n    // 05 — Песочные часы\n    const m5 = [];\n    for (let i = 0; i < 13; i++) { const t = i / 12; const y = 44 + t * 112; bothEnds(m5, 100, y, 12 + Math.abs(2 * t - 1) * 52, 3.8); }\n\n    // 06 — Шеврон-вершина (nested ∧)\n    const m6 = [];\n    for (let k = 0; k < 7; k++) { const span = 16 + k * 12; const ay = 52 + k * 2; m6.push(sliver(100, ay, 100 - span, 150, 4.0, 0.4)); m6.push(sliver(100, ay, 100 + span, 150, 4.0, 0.4)); }\n\n    // 07 — Шеврон вправо (nested ›)\n    const m7 = [];\n    for (let k = 0; k < 7; k++) { const span = 16 + k * 12; const ax = 152 - k * 2; m7.push(sliver(ax, 100, 70, 100 - span, 4.0, 0.4)); m7.push(sliver(ax, 100, 70, 100 + span, 4.0, 0.4)); }\n\n    // 08 — Восходящая диагональ\n    const m8 = [];\n    for (let i = 0; i < 12; i++) { m8.push(sliver(40 + i * 9, 158, 96 + i * 9, 62, 3.6, 0.4)); }\n\n    // 09 — Перекрёст (X / mesh)\n    const m9 = [];\n    for (let i = 0; i < 5; i++) { const cy0 = 100 + (i - 2) * 19; m9.push(sliver(44, cy0 + 38, 156, cy0 - 38, 3.4, 0.4)); }\n    for (let i = 0; i < 5; i++) { const cy0 = 100 + (i - 2) * 19; m9.push(sliver(44, cy0 - 38, 156, cy0 + 38, 3.4, 0.4)); }\n\n    // 10 — Вертикали / позвоночник\n    const m10 = [];\n    for (let i = 0; i < 12; i++) { const t = i / 11; const x = 42 + i * (116 / 11); const half = 42 + Math.sin(Math.PI * t) * 18; m10.push(sliver(x, 100 - half, x, 100, 3.4, 0.4)); m10.push(sliver(x, 100 + half, x, 100, 3.4, 0.4)); }\n\n    // 11 — Сетка / матрица\n    const m11 = [];\n    for (let i = 0; i < 7; i++) { const y = 50 + i * (100 / 6); m11.push(sliver(44, y, 156, y, 3.0, 0.4)); }\n    for (let i = 0; i < 7; i++) { const x = 50 + i * (100 / 6); m11.push(sliver(x, 44, x, 156, 3.0, 0.4)); }\n\n    // 12 — Веер прямых\n    const m12 = [];\n    const px = 44, py = 162;\n    for (let i = 0; i < 16; i++) { const a = -Math.PI / 2 + (i / 15) * (Math.PI / 2); m12.push(sliver(px, py, px + Math.cos(a) * 124, py + Math.sin(a) * 124, 4.2, 0.4)); }\n\n    const bug = () => {\n      const k = 'b' + (uid++);\n      return React.createElement('svg', { viewBox: '0 0 24 20', width: 22, height: 18, style: { display: 'block', flex: 'none' } },\n        React.createElement('defs', null,\n          React.createElement('linearGradient', { id: 'g' + k, x1: '0', y1: '0', x2: '1', y2: '1' },\n            React.createElement('stop', { offset: '0', stopColor: GR0 }),\n            React.createElement('stop', { offset: '1', stopColor: GR1 }))),\n        React.createElement('g', null,\n          [3, 7, 11, 15].map((y, i) => React.createElement('path', { key: i, d: sliver(23, y, 23 - (15 - i * 2.5), y, 2.4, 0.3), fill: `url(#g${k})` })))\n      );\n    };\n\n    const data = [\n      { name: '«Поток»', tag: 'Сигнал', lines: 12, mark: m1, desc: 'Массив биосигналов — поток данных от датчиков к экзоскелету. Считывание и передача.' },\n      { name: '«Восхождение»', tag: 'Прогресс', lines: 12, mark: m2, desc: 'Реабилитация шаг за шагом: лесенка восходящих полос как путь восстановления.' },\n      { name: '«Опора»', tag: 'Устойчивость', lines: 12, mark: m3, desc: 'Пирамида-ступени: иерархия от сигнала к движению, устойчивость и поддержка тела.' },\n      { name: '«Фокус»', tag: 'Точка', lines: 13, mark: m4, desc: 'Ромб собирает полосы к центру — точка приложения силы, сустав, концентрация.' },\n      { name: '«Цикл»', tag: 'Время', lines: 13, mark: m5, desc: 'Песочные часы: сжатие и восстановление, реабилитация как процесс во времени.' },\n      { name: '«Подъём»', tag: 'Поддержка', lines: 14, mark: m6, desc: 'Шеврон-вершина: корпус экзоскелета поднимает и держит. Сила и направление вверх.' },\n      { name: '«Движение»', tag: 'Походка', lines: 14, mark: m7, desc: 'Шеврон вправо — вектор вперёд, восстановленная походка, динамика и скорость.' },\n      { name: '«Импульс»', tag: 'Нерв', lines: 12, mark: m8, desc: 'Восходящая диагональ: нервный импульс и траектория усилия, переданного в привод.' },\n      { name: '«Связь»', tag: 'Сеть', lines: 10, mark: m9, desc: 'Перекрёст полос — нейронные связи и сочленение «человек ↔ машина».' },\n      { name: '«Каркас»', tag: 'Позвоночник', lines: 12, mark: m10, desc: 'Вертикали-позвонки: позвоночный столб и несущий каркас экзоскелета.' },\n      { name: '«Матрица»', tag: 'Система', lines: 14, mark: m11, desc: 'Сетка-модуль: сенсорная матрица, система датчиков и обратной связи.' },\n      { name: '«Синапс»', tag: 'Иннервация', lines: 16, mark: m12, desc: 'Веер прямых лучей из одной точки — расходящийся сигнал, синапс, иннервация.' },\n    ];\n\n    const cards = data.map((d, i) => ({\n      name: d.name, tag: d.tag, desc: d.desc, lines: d.lines,\n      code: 'AK 01.' + String(i + 1).padStart(2, '0'),\n      mark: svg(d.mark), bug: bug(),\n    }));\n\n    // ===== Ещё 12 · нейро + ИИ / автоматизация (тот же приём и цвет) =====\n    const TAU = Math.PI * 2;\n    const n1 = [ sliver(47,166,47,37,12,0.5), sliver(47,37,153,166,12,0.5), sliver(153,166,153,37,12,0.5) ];\n    const n2 = (() => { const o=[]; for (let i=0;i<7;i++){ const a=i/7*TAU-Math.PI/2; const R=i===0?84:70; o.push(sliver(100,100,100+Math.cos(a)*R,100+Math.sin(a)*R,9,0.4)); } return o; })();\n    const n3 = (() => { const o=[]; const c=[104,108]; const d=[-168,-140,-112,-84,-56,-28,6]; d.forEach((deg,i)=>{ const a=deg*Math.PI/180; const R=58+(i%2?17:7); o.push(sliver(c[0],c[1],c[0]+Math.cos(a)*R,c[1]+Math.sin(a)*R,8,0.4)); }); const aa=64*Math.PI/180; o.push(sliver(c[0],c[1],c[0]+Math.cos(aa)*88,c[1]+Math.sin(aa)*88,11,0.4)); return o; })();\n    const n4 = (() => { const o=[]; for (let i=0;i<9;i++){ const x=33+i*16.7; const h=20+107*Math.exp(-Math.pow((x-100)/33,2)); o.push(sliver(x,168,x,168-h,7,0.4)); } return o; })();\n    const n5 = [ sliver(27,157,57,43,11,0.5), sliver(83,157,57,43,11,0.5), sliver(40,107,70,107,9,0.5), sliver(107,157,107,43,11,0.5), sliver(107,100,150,43,10,0.5), sliver(107,100,150,157,10,0.5) ];\n    const n6 = (() => { const o=[]; const R=77; for (let i=0;i<15;i++){ const y=33+i*(134/14); const half=Math.sqrt(Math.max(0,R*R-(y-100)*(y-100))); if(half<6)continue; o.push(sliver(100,y,100-half,y,7.6,0.4)); o.push(sliver(100,y,100+half,y,7.6,0.4)); } return o; })();\n    const n7 = (() => { const o=[]; const n=13; for (let i=0;i<n;i++){ const y=40+i*(120/(n-1)); const lx=70+47*(0.5+0.5*Math.sin(i/(n-1)*Math.PI*3)); o.push(sliver(170,y,lx,y,7.2,0.4)); } return o; })();\n    const n8 = (() => { const o=[]; const n=14; for (let i=0;i<n;i++){ const y=37+i*(126/(n-1)); const lx=47+(i%2?13:0)+8*Math.sin(i*0.8); o.push(sliver(173,y,lx,y,6.8,0.4)); } return o; })();\n    const n9 = (() => { const P=[[50,63],[100,40],[150,70],[63,133],[123,140],[100,93],[163,117]]; const E=[[5,0],[5,1],[5,2],[5,3],[5,4],[1,2],[3,4],[2,6]]; return E.map(([a,b])=>sliver(P[a][0],P[a][1],P[b][0],P[b][1],7,0.4)); })();\n    const n10 = (() => { const o=[]; const R=73,n=30,c=100; for (let i=0;i<n;i++){ const a1=i/n*TAU; const a2=(i*2%n)/n*TAU; o.push(sliver(c+Math.cos(a1)*R,c+Math.sin(a1)*R,c+Math.cos(a2)*R,c+Math.sin(a2)*R,5,0.4)); } return o; })();\n    const n11 = (() => { const o=[]; const tg=(x,y,ang,len,depth,w)=>{ const x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len; o.push(sliver(x,y,x2,y2,w,0.4)); if(depth>0){ tg(x2,y2,ang-0.5,len*0.72,depth-1,w*0.74); tg(x2,y2,ang+0.5,len*0.72,depth-1,w*0.74); } }; tg(100,182,-Math.PI/2,50,3,11); return o; })();\n    const n12 = (() => { const o=[]; for (let i=0;i<6;i++){ o.push(sliver(43+i*18,170,110+i*18,50,8,0.4)); } return o; })();\n\n    // Точка ветвления (дендрит): один вход → древовидное ветвление\n    const n13 = (() => { const o=[]; const tg=(x,y,ang,len,depth,w)=>{ const x2=x+Math.cos(ang)*len,y2=y+Math.sin(ang)*len; o.push(sliver(x,y,x2,y2,w,0.4)); if(depth>0){ tg(x2,y2,ang-0.62,len*0.7,depth-1,w*0.72); tg(x2,y2,ang-0.04,len*0.74,depth-1,w*0.72); tg(x2,y2,ang+0.6,len*0.7,depth-1,w*0.72); } }; tg(100,188,-Math.PI/2,40,3,8.5); return o; })();\n\n    // Бинарный нейрон: входы-данные 0/1 → один чистый импульс\n    const n14 = (() => { const o=[]; const cx=104,cy=100; const ys=[43,66,89,111,134,157]; ys.forEach((y,i)=>{ const lx=(i%2?23:43); o.push(sliver(lx,y,cx,cy,i%2?9:5.4,0.4)); }); o.push(sliver(cx,cy,183,100,11,0.4)); return o; })();\n\n    // Negative-space «N»: буква из пустоты между полосами-связями\n    const n15 = (() => { const o=[]; const x0=37,x1=163,y0=43,y1=157,rows=15; const stems=[[37,63],[137,163]];\n      for(let r=0;r<rows;r++){ const y=y0+(y1-y0)*r/(rows-1); const xc=37+(163-37)*(y-40)/(160-40); const bands=[...stems,[xc-18,xc+18]].sort((a,b)=>a[0]-b[0]); let cur=x0; const segs=[];\n        bands.forEach(b=>{ const bs=Math.max(x0,b[0]),be=Math.min(x1,b[1]); if(bs>cur)segs.push([cur,bs]); cur=Math.max(cur,be); }); if(cur<x1)segs.push([cur,x1]);\n        segs.forEach(s=>{ if(s[1]-s[0]>5)o.push(sliver(s[1],y,s[0],y,7.3,0.4)); }); }\n      return o; })();\n\n    // Пульсирующее ядро: центр + концентрические волны (удлинённые линии)\n    const n16 = (() => { const o=[]; const c=100; for(let i=0;i<10;i++){ const a=i/10*TAU; o.push(sliver(c,c,c+Math.cos(a)*46,c+Math.sin(a)*46,6.5,0.4)); }\n      [56,82].forEach((R,ri)=>{ const seg=ri?20:14; for(let i=0;i<seg;i++){ const a=i/seg*TAU; const tx=c+Math.cos(a)*R,ty=c+Math.sin(a)*R; const dx=-Math.sin(a),dy=Math.cos(a); const half=(Math.PI*R/seg)*0.7; o.push(sliver(tx-dx*half,ty-dy*half,tx+dx*half,ty+dy*half,5,0.4)); } });\n      return o; })();\n\n    // Гексагон-нейросеть: модуль + внутренние связи\n    const n17 = (() => { const o=[]; const c=100,R=77; const V=[]; for(let i=0;i<6;i++){ const a=-Math.PI/2+i/6*TAU; V.push([c+Math.cos(a)*R,c+Math.sin(a)*R]); }\n      for(let i=0;i<6;i++){ const A=V[i],B=V[(i+1)%6]; o.push(sliver(A[0],A[1],B[0],B[1],7.6,0.4)); }\n      [[0,2],[2,4],[4,0],[1,3]].forEach(([a,b])=>o.push(sliver(V[a][0],V[a][1],V[b][0],V[b][1],5.4,0.4)));\n      return o; })();\n\n    // Зеркальная симметрия мозга: две полусферы + центральная борозда\n    const n18 = (() => { const o=[]; const n=7; for(let i=0;i<n;i++){ const t=i/(n-1); const y=43+t*114; const reach=27+Math.sin(Math.PI*t)*57; o.push(sliver(107,y,107+reach,y,7.3,0.4)); o.push(sliver(93,y,93-reach,y,7.3,0.4)); }\n      o.push(sliver(100,50,100,73,6.5,0.4)); o.push(sliver(100,150,100,127,6.5,0.4)); return o; })();\n\n    // Спираль обучения: уплотнение к центру (удлинённые линии)\n    const n19 = (() => { const o=[]; const c=100,n=22; for(let i=0;i<n;i++){ const t=i/(n-1); const ang=t*4.4*Math.PI; const r=10+t*80; const r2=r+(9+t*17); const ang2=ang+0.29; o.push(sliver(c+Math.cos(ang2)*r2,c+Math.sin(ang2)*r2,c+Math.cos(ang)*r,c+Math.sin(ang)*r,5.4,0.4)); } return o; })();\n\n    // ── Синаптическая серия (тапер-полосы + акцентная искра) ──\n    const circ = (x,y,r) => `M${(x-r).toFixed(2)} ${y.toFixed(2)} a${r} ${r} 0 1 0 ${(2*r).toFixed(2)} 0 a${r} ${r} 0 1 0 ${(-2*r).toFixed(2)} 0 Z`;\n    const acc = (d) => ({ d, fill: ACC });\n    const term = (out, stem  })();\n\n    // Радиальный синапс: центральный терминал раздаёт связи во все стороны\n    const n25 = (() => { const o=[]; const c=100,N=6; o.push(circ(c,c,13)); for(let k=0;k<N;k++){ const ang=k/N*TAU-Math.PI/2; const fx=c+Math.cos(ang)*24, fy=c+Math.sin(ang)*24, tx=c+Math.cos(ang)*80, ty=c+Math.sin(ang)*80; const px=-Math.sin(ang), py=Math.cos(ang); for(let i=0;i<5;i++){ const t=i/4-0.5; o.push(sliver(fx,fy,tx+px*t*30,ty+py*t*30,5,0.5)); } o.push(acc(circ(c+Math.cos(ang)*64,c+Math.sin(ang)*64,3))); } return o; })();\n\n    // Двойной нейрон + щель: два тела с отростками, сходящиеся в синапс\n    const n26 = (() => { const o=[]; o.push(circ(46,86,11)); for(let i=0;i<4;i++){ const ang=Math.PI*(0.7+i*0.18); o.push(sliver(46,86,46+Math.cos(ang)*30,86+Math.sin(ang)*30,5,0.5)); } o.push(sliver(46,86,90,100,8,1.5)); o.push(circ(154,114,11)); for(let i=0;i<4;i++){ const ang=(i*0.18-0.2); o.push(sliver(154,114,154+Math.cos(ang)*30,114+Math.sin(ang)*30,5,0.5)); } o.push(sliver(154,114,110,100,8,1.5)); o.push(acc(circ(100,100,3.6))); o.push(acc(circ(94,94,2.6))); o.push(acc(circ(106,106,2.6))); return o; })();\n\n    // Импульс в зазоре: сигнал как волна в синаптической щели\n    const n27 = (() => { const o=[]; term(o,22,86,100,1,84,7); term(o,178,114,100,-1,84,7); const pts=[]; for(let i=0;i<=12;i++){ const t=i/12; pts.push([100+Math.sin(t*Math.PI*2)*9, 64+t*72]); } for(let i=0;i<pts.length-1;i++) o.push(acc(sliver(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],4.5,4.5))); return o; })();\n\n    const neuroData = [\n      ['Синапс','Сигнал', n2, 'Полосы расходятся из центра — передача сигнала, инсайта.'],\n      ['Синапс 2','Нейрон', n3, 'Направленный нейрон: дендритный веер и аксон, выстреливающий импульс.'],\n      ['Импульс','Нерв', n4, 'Спайк активности — всплеск и передача решения по сети.'],\n      ['«Мыслящая» сфера','Ядро', n6, 'Глобус из горизонтальных полос — «мозг системы», ядро интеллекта.'],\n      ['Нейро-волна','Поток', n7, 'Левые концы полос рисуют волну — да +Math.sin(a2)*30)); }\n      const c4 = []; { const tw = 0.85; for (let i = 0; i < 28; i++) { const a = (i/28)*T; c4.push(thread(100+Math.cos(a)*78, 52+Math.sin(a)*20, 100+Math.cos(a+tw)*78, 148+Math.sin(a+tw)*20)); } }\n      const c5 = []; { const R5 = 40; for (let i = 0; i < 20; i++) { const a = (i/20)*T; const tx = 100+Math.cos(a)*R5, ty = 100+Math.sin(a)*R5; const dx = -Math.sin(a), dy = Math.cos(a); c5.push(thread(tx-dx*58, ty-dy*58, tx+dx*58, ty+dy*58)); } }\n      const c6 = chordCurve(100, 100, 84, 36, 3);\n      const c7 = chordCurve(100, 100, 84, 40, 5);\n      const c8 = chordCurve(100, 100, 84, 38, 4);\n      const c9 = []; for (let i = 0; i <= 10; i++) { const t = i/10; c9.push(thread(40, 40+t*120, 40+t*120, 160)); c9.push(thread(160, 40+t*120, 160-t*120, 160)); }\n      const c10 = []; { const per = 20; for (let a = 0; a < 2; a++) { for (let i = 0; i < per; i++) { const t = i/per; const ang = a*Math.PI + t*3.6; const r = 12+t*78; const r2 = r+27; const ang2 = ang+0.34; c10.push(thread(100+Math.cos(ang2)*r2, 100+Math.sin(ang2)*r2, 100+Math.cos(ang)*r, 100+Math.sin(ang)*r)); } } }\n      const c11 = []; { const apex = [100,34], lb = [52,170], rb = [148,170]; c11.push(sliver(lb[0],lb[1],apex[0],apex[1],TH,0.5)); c11.push(sliver(rb[0],rb[1],apex[0],apex[1],TH,0.5)); c11.push(sliver(74,124,126,124,TH,0.5)); }\n      const c12 = []; for (let i = 0; i < 11; i++) { const t = i/10; const off = -54+t*108; const a = 0.21, cA = Math.cos(a), sA = Math.sin(a); c12.push(thread(100+off*cA-(-64)*sA, 100+off*sA+(-64)*cA, 100+off*cA-64*sA, 100+off*sA+64*cA)); const b = -0.21, cB = Math.cos(b), sB = Math.sin(b); c12.push(thread(100+off*cB-(-64)*sB, 100+off*sB+(-64)*cB, 100+off*cB-64*sB, 100+off*sB+64*cB)); }\n      const c13 = chordCurve(100, 100, 84, 42, 6);\n      const c14 = [ ...bezierFan([38,100],[100,48],[162,100],9), ...bezierFan([38,100],[100,152],[162,100],9) ];\n      const c15 = []; { const bx = 100, by = 178; for (let i = 0; i < 18; i++) { const t = i/17; const a = -Math.PI*0.86 + t*(Math.PI*0.72); c15.push(thread(bx, by, bx+Math.cos(a)*140, by+Math.sin(a)*140)); } }\n      const c16 = []; { const C16 = [100,102], S16 = 50, c30 = Math.cos(Math.PI/6), s30 = Math.sin(Math.PI/6); const iso = (x,y,z) => [C16[0]+(x-z)*c30*S16, C16[1]+((x+z)*s30-y)*S16]; const Vv = { A: iso(0,0,0), B: iso(1,0,0), C: iso(1,0,1), D: iso(0,0,1), E: iso(0,1,0), F: iso(1,1,0), G: iso(1,1,1), H: iso(0,1,1) }; [['E','F'],['F','G'],['G','H'],['H','E'],['A','E'],['B','F'],['C','G'],['D','H'],['A','B'],['B','C'],['C','D']].forEach(([a,b]) => c16.push(sliver(Vv[a][0],Vv[a][1],Vv[b][0],Vv[b][1],TH,1.2))); }\n      const c17 = []; { const hx = 100, hy = 156; for (let i = 0; i < 17; i++) { const t = i/16; const a = -Math.PI + t*Math.PI; c17.push(thread(hx, hy, hx+Math.cos(a)*92, hy+Math.sin(a)*92)); } c17.push(sliver(24,hy,100,hy,TH,0.6)); c17.push(sliver(176,hy,100,hy,TH,0.6)); }\n      const c18 = chordCurve(100, 100, 84, 24, 8);\n\n      const _dot = (p,r)=>`M${(p[0]-r).toFixed(2)} ${p[1].toFixed(2)} a${r} ${r} 0 1 0 ${(2*r).toFixed(2)} 0 a${r} ${r} 0 1 0 ${(-2*r).toFixed(2)} 0 Z`;\n\n      // Сечение реактора/турбины: радиальные лопасти + обод + ядро\n      const c21 = (() => { const out=[]; const c=100,Ro=84,Ri=30,N=24; for(let i=0;i<N;i++){const a=i/N*T; out.push(sliver(c+Math.cos(a)*Ri,c+Math.sin(a)*Ri,c+Math.cos(a)*Ro,c+Math.sin(a)*Ro,5.4,1.4));} const ring=36; for(let i=0;i<ring;i++){const a1=i/ring*T,a2=(i+1)/ring*T; out.push(sliver(c+Math.cos(a1)*Ro,c+Math.sin(a1)*Ro,c+Math.cos(a2)*Ro,c+Math.sin(a2)*Ro,3.2,3.2));} out.push(_dot([c,c],10)); return out; })();\n\n      // Орбитальное ядро: центр + наклонная орбита\n      const c22 = (() => { const out=[]; const c=100,ra=84,rb=34,rot=-0.5,N=60; const pts=[]; for(let i=0;i<=N;i++){const t=i/N*T; const x=Math.cos(t)*ra,y=Math.sin(t)*rb; pts.push([c+x*Math.cos(rot)-y*Math.sin(rot),c+x*Math.sin(rot)+y*Math.cos(rot)]);} for(let i=0;i<N;i++) out.push(sliver(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],3.4,3.4)); const Nc=20; for(let i=0;i<Nc;i++){const a=i/Nc*T; out.push(sliver(c,c,c+Math.cos(a)*22,c+Math.sin(a)*22,5,0.4));} out.push(_dot([c,c],11)); return out; })();\n\n      // Пульс сквозь ядро: линия-график рынка через центральный узел\n      const c23 = (() => { const out=[]; const xs=[20,46,72,100,128,154,182], ys=[120,96,134,82,108,60,92]; for(let i=0;i<xs.length-1;i++) out.push(sliver(xs[i],ys[i],xs[i+1],ys[i+1],5.2,5.2)); const Nc=14; for(let i=0;i<Nc;i++){const a=i/Nc*T; out.push(sliver(100,82,100+Math.cos(a)*22,82+Math.sin(a)*22,3.4,0.3));} out.push(_dot([100,82],13)); return out; })();\n\n      // Диафрагма/ирис: лопасти, складывающиеся в раскрытое ядро\n      const c24 = (() => { const out=[]; const c=100,N=7,Ro=86,Ri=30; for(let i=0;i<N;i++){const a=i/N*T,a2=a+1.25; out.push(sliver(c+Math.cos(a)*Ro,c+Math.sin(a)*Ro,c+Math.cos(a2)*Ri,c+Math.sin(a2)*Ri,6,1.2));} const ring=30; for(let i=0;i<ring;i++){const a1=i/ring*T,a2=(i+1)/ring*T; out.push(sliver(c+Math.cos(a1)*Ro,c+Math.sin(a1)*Ro,c+Math.cos(a2)*Ro,c+Math.sin(a2)*Ro,2.6,2.6));} return out; })();\n\n      // Слоёное ядро: концентрические слои разной плотности\n      const c25 = (() => { const out=[]; const c=100; [28,44,60,76].forEach((R,ri)=>{ const seg=Math.round(R*0.7); for(let i=0;i<seg;i++){const a1=i/seg*T,a2=(i+1)/seg*T; out.push(sliver(c+Math.cos(a1)*R,c+Math.sin(a1)*R,c+Math.cos(a2)*R,c+Math.sin(a2)*R,5.4-ri*0.7,5.4-ri*0.7));} }); out.push(_dot([c,c],9)); return out; })();\n\n      // Магнитное поле: ядро + силовые линии\n      const c26 = (() => { const out=[]; const c=100; const bez=(p0,c1,c2,p3)=>{const N=24; let prev=p0; for(let i=1;i<=N;i++){const t=i/N,mt=1-t; const x=mt*mt*mt*p0[0]+3*mt*mt*t*c1[0]+3*mt*t*t*c2[0]+t*t*t*p3[0]; const y=mt*mt*mt*p0[1]+3*mt*mt*t*c1[1]+3*mt*t*t*c2[1]+t*t*t*p3[1]; out.push(sliver(prev[0],prev[1],x,y,3.0,3.0)); prev=[x,y];}}; for(let s=-1;s<=1;s+=2){ for(let k=0;k<4;k++){ const spread=34+k*20; const top=[c,c-16],bot=[c,c+16]; bez(top,[c+s*spread,c-72],[c+s*spread,c+72],bot);} } const Nc=16; for(let i=0;i<Nc;i++){const a=i/Nc*T; out.push(sliver(c,c,c+Math.cos(a)*18,c+Math.sin(a)*18,4.5,0.4));} out.push(_dot([c,c],9)); return out; })();\n\n      // Узел-схождение: потоки сходятся в одну плотную точку\n      const c27 = (() => { const out=[]; const c=[100,108]; const sources=[[20,30],[60,18],[110,16],[170,26],[185,80],[30,80],[176,150],[40,160],[100,184],[150,176]]; sources.forEach(s=>out.push(sliver(s[0],s[1],c[0],c[1],5.2,0.5))); out.push(_dot(c,13)); return out; })();\n\n      // Алмаз-сеть: гранёный кристалл с узловой нейросетью внутри\n      const c19 = (() => { const out = [];\n        const seg=(a,b,wi,wo)=>out.push(sliver(a[0],a[1],b[0],b[1],wi,wo));\n        const dot=(p,r)=>out.push(`M${(p[0]-r).toFixed(2)} ${p[1].toFixed(2)} a${r} ${r} 0 1 0 ${(2*r).toFixed(2)} 0 a${r} ${r} 0 1 0 ${(-2*r).toFixed(2)} 0 Z`);\n        const T=[100,18],Bv=[100,182],Lv=[22,100],Rv=[178,100];\n        const N={ a:[108,64], b:[128,90], c:[108,104], d:[78,104], e:[64,114], f:[90,124], g:[116,118], h:[104,150], r:[150,108] };\n        [[T,N.a],[T,N.d],[T,N.r],[Lv,N.d],[Lv,N.e],[Lv,N.f],[Rv,N.r],[Rv,N.b],[Bv,N.h],[Bv,N.f],[Bv,N.g],[Lv,N.g],[Rv,N.d]].forEach(e=>seg(e[0],e[1],5.0,0.4));\n        [[T,Rv],[Rv,Bv],[Bv,Lv],[Lv,T]].forEach(e=>seg(e[0],e[1],6.5,1.6));\n        [['c','a'],['c','b'],['c','d'],['c','g'],['b','r'],['a','b'],['d','e'],['d','f'],['f','g'],['f','h'],['g','h'],['r','g']].forEach(e=>seg(N[e[0]],N[e[1]],4.2,0.4));\n        dot(T,4.2); dot(Bv,4.2); dot(Lv,4.2); dot(Rv,4.2);\n        Object.keys(N).forEach(k=>dot(N[k],3));\n        return out; })();\n\n      // Вспышка: радиальный санбёрст из тапер-полос, удлинённые лучи по осям\n      const c20 = (() => { const out=[]; const c=100, Ns=48; for(let i=0;i<Ns;i++){ const ang=-Math.PI/2 + i/Ns*Math.PI*2; const cardinal=(i%(Ns/4)===0); const len=cardinal?88:60+(i%2?5:13); out.push(sliver(c,c,c+Math.cos(ang)*len,c+Math.sin(ang)*len,4.4,0.4)); } return out; })();\n\n      const coreData = [\n        ['«Ядро»','Core', c1, 'Кардиоида из полос — сердечник интеллекта, из которого исходят все агенты.'],\n        ['«Дерево»','Сеть', c2, 'Дерево как сеть: оркестрация и ветвление задач из общего корня.'],\n        ['«Вихрь»','Обработка', c3, 'Закрученные полосы с ядром-просветом — поток обработки, живой процесс мышления.'],\n        ['«Глубина»','3D', c4, 'Гиперболоид из прямых: объёмное ядро с талией — глубина рассуждения.'],\n        ['«Апертура»','Внимание', c5, 'Диафрагма из касательных — фокус внимания агента, раскрытие контекста.'],\n        ['«Резонанс»','Синхрон', c6, 'Нефроида — несколько агентов в резонансе, согласованная работа.'],\n        ['«Точность»','Align', c7, 'Звёздная огибающая (mult 5) — выравнивание и точность ответа.'],\n        ['«Поток»','Пайплайн', c8, 'Огибающая mult 4 — устойчивый поток данных по системе агентов.'],\n        ['«Консенсус»','Слияние', c9, 'Две параболы-воронки из полос — агенты сходятся к единому решению.'],\n        ['«Галактика»','Масштаб', c10, 'Спиральные рукава из полос — масштаб роя агентов, рост системы.'],\n        ['«Эмерджентность»','Муар', c12, 'Муар двух сеток прямых — из простых линий рождается новый узор.'],\n        ['«Орбита»','Рой', c13, 'Огибающая mult 6 — созвездие агентов на орбите единого ядра.'],\n        ['«Линза»','Фокус', c14, 'Линза из встречных вееров полос — фокусировка контекста и инференс.'],\n        ['«Импульс»','Сигнал', c15, 'Луч-веер из точки — испускание сигнала, отклик агента.'],\n        ['«Куб»','3D', c16, 'Изокуб из тапер-полос — вычислительный блок, объёмное ядро.'],\n        ['«Восход»','Запуск', c17, 'Арка лучей над горизонтом — запуск, рост возможностей платформы.'],\n        ['«Кристалл»','Знания', c18, 'Огибающая mult 8 — кристалл знаний, плотная структура памяти.'],\n        ['«Алмаз-сеть»','Узлы', c19, 'Гранёный алмаз с узловой нейросетью внутри — данные в огранке, прочное ядро интеллекта.'],\n        ['«Вспышка»','Излучение', c20, 'Радиальная вспышка из прямых тапер-полос — испускание сигнала, активность ядра во все стороны.'],\n        ['«Реактор»','Сечение', c21, 'Срез турбины — радиальные лопасти и ядро, энергетическое ДНК Концерна.'],\n        ['«Орбитальное ядро»','Гравитация', c22, 'Ядро и орбита, пересекающая его — центр притяжения системы, динамика без хаоса.'],\n        ['«Пульс рынка»','Trading', c23, 'Линия-график рынка сквозь центральное ядро — рынок, движение, момент решения.'],\n        ['«Диафрагма»','Фокус', c24, 'Лопасти ириса, раскрывающие ядро — фокус, точка сборки, открытие контекста.'],\n        ['«Слоёное ядро»','Глубина', c25, 'Концентрические слои разной плотности — глубина, структура, надёжность.'],\n        ['«Магнитное поле»','Энергия', c26, 'Ядро и силовые линии вокруг него — энергия, притяжение, активная система.'],\n        ['«Узел-схождение»','Сборка', c27, 'Потоки, сходящиеся в одну плотную точку — ядро как место сборки всех процессов.'],\n      ];\n      return coreData.map((d, i) => ({ name: d[0], tag: d[1], desc: d[3], lines: d[2].length, code: 'AK CORE.' + String(i + 1).padStart(2, '0'), mark: svg(d[2]), bug: bug() }));\n    })();\n\n    return { cards, cards2, cardsCore, bug: bug(), bug2: bug(), bug3: bug(), bug4: bug(), bug5: bug() };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
